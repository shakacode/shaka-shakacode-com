name: Site Build and Deploy

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      - name: Sync docs
        run: npm run sync:docs
        env:
          SHAKA_REPO_URL: https://github.com/shakacode/shaka.git
          SHAKA_REF: main

      - name: Prepare docs
        run: npm run prepare:docs

      - name: Audit docs
        run: npm run audit:docs -- --strict --output "$RUNNER_TEMP/docs-audit.md"

      - name: Install site dependencies
        run: npm --prefix prototypes/docusaurus install

      - name: Test Algolia configuration
        run: npm run test:algolia-config

      - name: Build site
        run: npm run build:site
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_APP_ID != '' && secrets.ALGOLIA_SEARCH_API_KEY != '' && vars.ALGOLIA_INDEX_NAME || '' }}

  deploy:
    # Only code merged to main runs with Cloudflare credentials. Pull requests build
    # without deploying: wrangler can run a build command from a candidate wrangler.toml.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: pages-deploy
      url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      - name: Sync docs
        run: npm run sync:docs
        env:
          SHAKA_REPO_URL: https://github.com/shakacode/shaka.git
          SHAKA_REF: main

      - name: Prepare docs
        run: npm run prepare:docs

      - name: Audit docs
        run: npm run audit:docs -- --strict --output "$RUNNER_TEMP/docs-audit.md"

      - name: Install site dependencies
        run: npm --prefix prototypes/docusaurus install

      - name: Test Algolia configuration
        run: npm run test:algolia-config

      - name: Build site
        run: npm run build:site
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_APP_ID != '' && secrets.ALGOLIA_SEARCH_API_KEY != '' && vars.ALGOLIA_INDEX_NAME || '' }}

      - name: Deploy to Cloudflare
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler@4 deploy | tee /tmp/wrangler.log
          DEPLOYMENT_URL="https://shaka.shakacode.com"
          echo "deployment_url=${DEPLOYMENT_URL:-unknown}" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare deployment"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- URL: ${DEPLOYMENT_URL:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
