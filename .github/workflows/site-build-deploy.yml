name: Site Build and Deploy

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      - name: Sync docs
        run: npm run sync:docs
        env:
          SHAKA_REPO_URL: https://github.com/shakacode/shaka.git
          SHAKA_REF: main

      - name: Prepare docs
        run: npm run prepare:docs

      - name: Install site dependencies
        run: npm --prefix prototypes/docusaurus install

      - name: Test Algolia configuration
        run: npm run test:algolia-config

      - name: Build site
        run: npm run build:site
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_APP_ID != '' && secrets.ALGOLIA_SEARCH_API_KEY != '' && vars.ALGOLIA_INDEX_NAME || '' }}

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pages-deploy
      url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20

      - name: Sync docs
        run: npm run sync:docs
        env:
          SHAKA_REPO_URL: https://github.com/shakacode/shaka.git
          SHAKA_REF: main

      - name: Prepare docs
        run: npm run prepare:docs

      - name: Install site dependencies
        run: npm --prefix prototypes/docusaurus install

      - name: Test Algolia configuration
        run: npm run test:algolia-config

      - name: Build site
        run: npm run build:site
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_APP_ID != '' && secrets.ALGOLIA_SEARCH_API_KEY != '' && vars.ALGOLIA_INDEX_NAME || '' }}

      - name: Deploy to Cloudflare
        id: deploy
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Preview version: does not change what shaka.shakacode.com serves.
            npx wrangler@4 versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" \
              --message "PR #${{ github.event.pull_request.number }}" | tee /tmp/wrangler.log
            DEPLOYMENT_URL="$(grep -Eo 'https://pr-[^ ]+\.workers\.dev' /tmp/wrangler.log | head -n 1 || true)"
          else
            npx wrangler@4 deploy | tee /tmp/wrangler.log
            DEPLOYMENT_URL="https://shaka.shakacode.com"
          fi
          echo "deployment_url=${DEPLOYMENT_URL:-unknown}" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare deployment"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- URL: ${DEPLOYMENT_URL:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- cf-pages-preview -->";
            const body = `${marker}
            Cloudflare preview deployed.

            - URL: ${process.env.DEPLOYMENT_URL}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
